<!-- admin.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel - Login Logs</title>
    <style>
        body { font-family: Arial; margin: 20px; background: #f5f5f5; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { background: #333; color: white; padding: 20px; border-radius: 5px; margin-bottom: 20px; }
        .stats { display: flex; gap: 20px; margin-bottom: 20px; }
        .stat-card { background: white; padding: 20px; border-radius: 5px; flex: 1; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .table-container { background: white; padding: 20px; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #f8f9fa; }
        .btn { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .btn:hover { background: #0056b3; }
        .map-link { color: #007bff; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Admin Panel - Login Logs</h1>
            <p>Data login terkumpul dari website</p>
        </div>
        
        <div class="stats">
            <div class="stat-card">
                <h3>Total Logins</h3>
                <p id="totalLogins">0</p>
            </div>
            <div class="stat-card">
                <h3>Unique Emails</h3>
                <p id="uniqueEmails">0</p>
            </div>
            <div class="stat-card">
                <h3>With Location</h3>
                <p id="withLocation">0</p>
            </div>
        </div>
        
        <div style="margin-bottom: 20px;">
            <button class="btn" onclick="refreshData()">Refresh Data</button>
            <button class="btn" onclick="exportData()" style="background: #28a745;">Export JSON</button>
            <button class="btn" onclick="clearData()" style="background: #dc3545;">Clear All Data</button>
        </div>
        
        <div class="table-container">
            <table id="logTable">
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Email</th>
                        <th>Waktu</th>
                        <th>Lokasi</th>
                        <th>Device</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="logTableBody">
                    <!-- Data akan diisi oleh JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function loadLogs() {
            const logs = JSON.parse(localStorage.getItem('loginLogs') || '[]');
            
            // Update stats
            document.getElementById('totalLogins').textContent = logs.length;
            
            const uniqueEmails = new Set(logs.map(log => log.email));
            document.getElementById('uniqueEmails').textContent = uniqueEmails.size;
            
            const withLocation = logs.filter(log => log.location).length;
            document.getElementById('withLocation').textContent = withLocation;
            
            // Populate table
            const tableBody = document.getElementById('logTableBody');
            tableBody.innerHTML = '';
            
            logs.forEach((log, index) => {
                const row = document.createElement('tr');
                
                const time = new Date(log.timestamp).toLocaleString('id-ID');
                const device = log.userAgent.split('(')[1]?.split(')')[0] || 'Unknown';
                
                let locationText = 'No location';
                if (log.location) {
                    locationText = `${log.location.lat.toFixed(4)}, ${log.location.lng.toFixed(4)}`;
                }
                
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${log.email}</td>
                    <td>${time}</td>
                    <td>${locationText}</td>
                    <td>${device}</td>
                    <td>
                        ${log.location ? 
                            `<a class="map-link" href="https://maps.google.com/?q=${log.location.lat},${log.location.lng}" target="_blank">
                                Lihat di Map
                            </a>` : 
                            '-'
                        }
                    </td>
                `;
                
                tableBody.appendChild(row);
            });
        }
        
        function exportData() {
            const logs = JSON.parse(localStorage.getItem('loginLogs') || '[]');
            if (logs.length === 0) {
                alert('No data to export');
                return;
            }
            
            const dataStr = JSON.stringify(logs, null, 2);
            const dataUri = 'data:application/json;charset=utf-8,' + encodeURIComponent(dataStr);
            
            const link = document.createElement('a');
            link.setAttribute('href', dataUri);
            link.setAttribute('download', 'login_logs_' + new Date().toISOString().split('T')[0] + '.json');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
        
        function clearData() {
            if (confirm('Yakin ingin menghapus semua data?')) {
                localStorage.removeItem('loginLogs');
                loadLogs();
                alert('Data berhasil dihapus');
            }
        }
        
        function refreshData() {
            loadLogs();
        }
        
        // Load data on page load
        document.addEventListener('DOMContentLoaded', loadLogs);
    </script>
</body>
</html>
